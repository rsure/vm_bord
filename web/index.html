<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vm_bord · 虚拟机看板</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1c2024;
    --muted: #6b7280;
    --accent: #2f6fed;
    --ok: #17a673;
    --warn: #d98500;
    --bad: #d64545;
    --bar: #eef1f5;
    --row-alt: #fafbfc;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1e2126;
      --border: #2e3239;
      --text: #e6e8eb;
      --muted: #9aa3ad;
      --accent: #6f9dff;
      --ok: #3ddc97;
      --warn: #f0b644;
      --bad: #ff7b72;
      --bar: #2a2e35;
      --row-alt: #23262c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .brand { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .brand span { color: var(--accent); }
  .origin {
    color: var(--muted); font-size: 12px;
    font-family: ui-monospace, Consolas, monospace;
    border: 1px solid var(--border); border-radius: 99px; padding: 2px 9px;
  }
  .stamp { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  button, select, input { font: inherit; color: var(--text); }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
    transition: border-color .15s, background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { opacity: .9; }
  main { padding: 20px; max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  #cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card.broken { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-title { font-size: 15px; font-weight: 640; }
  .card-sub { color: var(--muted); font-size: 12.5px; font-family: ui-monospace, Consolas, monospace; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); }
  .dot.off { background: var(--muted); }
  .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
  .kv div { min-width: 0; }
  .kv dt { color: var(--muted); font-size: 12px; margin: 0; }
  .kv dd { margin: 1px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kv dd .model {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--muted); font-size: 11.5px; line-height: 1.35;
  }
  .meter { margin-top: 2px; }
  .meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .meter-row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: var(--bar); border-radius: 99px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .track i.hot { background: var(--warn); }
  .track i.crit { background: var(--bad); }
  .card-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
  .card-foot a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .card-foot a:hover { text-decoration: underline; }
  .error-box {
    background: color-mix(in srgb, var(--bad) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
  }
  .error-box b { color: var(--bad); }
  .empty {
    text-align: center; padding: 64px 20px; color: var(--muted);
    border: 1px dashed var(--border); border-radius: 12px;
  }
  .empty h2 { color: var(--text); font-size: 16px; margin: 0 0 6px; }

  /* 虚拟机表 */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .toolbar input[type="search"] {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 11px; width: min(300px, 46vw);
  }
  .toolbar select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 9px; max-width: 220px;
  }
  .toolbar input:focus, .toolbar select:focus {
    outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -1px;
  }
  .count { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .table-scroll { max-height: min(60vh, 720px); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; background: var(--panel);
    text-align: left; font-weight: 600; color: var(--muted); font-size: 12px;
    padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1;
  }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--text); }
  thead th .arrow { opacity: .35; margin-left: 3px; }
  thead th.sorted .arrow { opacity: 1; color: var(--accent); }
  tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--row-alt); }
  tbody tr.row.open { background: var(--row-alt); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { font-weight: 560; max-width: 260px; }
  td.name .caret { color: var(--muted); margin-right: 5px; display: inline-block; transition: transform .15s; }
  tr.open td.name .caret { transform: rotate(90deg); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 99px; padding: 1px 9px; font-size: 12px;
    background: var(--bar); color: var(--text);
  }
  .pill.on { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .pill.off { background: var(--bar); color: var(--muted); }
  .pill.sus { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  td.acts { white-space: nowrap; position: relative; }
  button.act {
    font-size: 12px; line-height: 1; padding: 5px 9px; margin-right: 4px;
    border-radius: 6px; border: 1px solid var(--border); background: transparent;
    color: var(--text); cursor: pointer;
  }
  button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.act:disabled { opacity: .35; cursor: not-allowed; }
  button.act[data-act="shutdown"]:not(:disabled),
  button.act[data-act="reboot"]:not(:disabled) { color: var(--warn); }
  button.act[data-act="shutdown"]:hover:not(:disabled),
  button.act[data-act="reboot"]:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  button.act.more { color: var(--muted); padding: 5px 7px; }
  button.act.more[aria-expanded="true"] { border-color: var(--muted); color: var(--text); }

  /* 危险操作二级菜单 */
  .menu {
    position: absolute; right: 10px; top: calc(100% - 4px); z-index: 30;
    min-width: 128px; padding: 4px; text-align: left;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow);
  }
  .menu button {
    display: block; width: 100%; text-align: left; padding: 7px 10px;
    border: 0; border-radius: 6px; background: transparent;
    color: var(--bad); font-size: 12.5px;
  }
  .menu button:hover:not(:disabled) { background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .menu .menu-note {
    padding: 4px 10px 6px; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }

  /* 危险操作确认弹窗 */
  .modal {
    position: fixed; inset: 0; z-index: 70; display: none;
    place-items: center; background: rgba(8, 10, 14, .5);
  }
  .modal.open { display: grid; }
  .modal-card {
    width: min(460px, 92vw); padding: 20px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .modal-card h3 { margin: 0 0 10px; font-size: 15px; color: var(--bad); }
  .modal-card p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .modal-card code {
    padding: 1px 5px; border-radius: 4px; background: var(--bar); color: var(--text);
    font-size: 12.5px;
  }
  .modal-card label.check {
    display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin-bottom: 12px;
  }
  .modal-card input[type="text"] { width: 100%; }
  .modal-card .check-label { display: block; margin: 0 0 6px; font-size: 12.5px; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); opacity: .9; }
  tr.detail > td { background: var(--bg); padding: 0; border-bottom: 1px solid var(--border); }
  .detail-body {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px 24px; padding: 14px 44px;
  }
  .detail-body dt { color: var(--muted); font-size: 11.5px; }
  .detail-body dd { margin: 1px 0 0; overflow-wrap: anywhere; }
  .no-rows { padding: 34px; text-align: center; color: var(--muted); }

  /* 设置抽屉 */
  .overlay {
    position: fixed; inset: 0; background: rgba(8, 10, 14, .42);
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(430px, 92vw);
    background: var(--panel); border-left: 1px solid var(--border);
    transform: translateX(101%); transition: transform .2s ease;
    z-index: 21; display: flex; flex-direction: column;
    box-shadow: -12px 0 40px rgba(0, 0, 0, .15);
  }
  .drawer.open { transform: none; }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--border);
  }
  .drawer-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .drawer input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 10px;
  }
  .drawer input:focus {
    outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
    outline-offset: -1px; border-color: var(--accent);
  }
  .field { margin-bottom: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .host-list { display: flex; flex-direction: column; gap: 8px; }
  .host-item {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font-size: 13px; background: var(--bg);
  }
  .host-item .name { font-weight: 600; }
  .host-item .mono { color: var(--muted); }
  .host-item.editing { border-color: var(--accent); }
  .host-head { display: flex; align-items: center; gap: 8px; }
  .host-head .name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .host-ops { margin-left: auto; display: flex; gap: 6px; flex: 0 0 auto; }
  .host-ops button { font-size: 12px; padding: 3px 8px; }
  .host-ops button.danger-text { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
  .host-ops button.danger-text:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .tag {
    font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 99px;
    background: var(--bar); color: var(--muted);
  }
  .tag.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .remove-box {
    margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--border);
    font-size: 12.5px; color: var(--muted);
  }
  .remove-box input { width: 100%; margin: 7px 0; background: var(--panel); }
  .remove-ops { display: flex; gap: 8px; justify-content: flex-end; }
  .remove-ops button { font-size: 12px; padding: 4px 10px; }
  .remove-ops button.danger { color: #fff; }
  .danger-text { color: var(--bad); }
  .form-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .form-actions { display: flex; gap: 8px; align-items: center; }
  .warn-box {
    margin-top: 10px; padding: 8px 10px; border-radius: 7px; font-size: 12px;
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--border));
    color: var(--text);
  }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: var(--shadow); border-radius: 9px; padding: 10px 16px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    z-index: 30; max-width: 80vw; font-size: 13px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
</style>
</head>
<body>
<header>
  <div class="brand">vm<span>_bord</span></div>
  <span class="origin" id="origin" title="实际监听地址"></span>
  <span class="stamp" id="stamp">正在读取…</span>
  <button id="btn-settings">设置</button>
</header>

<main>
  <div id="cards"></div>

  <section class="table-wrap" id="vm-section">
    <div class="toolbar">
      <input type="search" id="q" placeholder="按名称或 IP 搜索" autocomplete="off">
      <select id="host-filter"><option value="">全部主机</option></select>
      <span class="count" id="count"></span>
      <button id="btn-refresh" style="margin-left:auto">刷新</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-key="name">名称<span class="arrow">▲</span></th>
            <th>主机</th>
            <th>IP</th>
            <th>操作系统</th>
            <th class="sortable" data-key="power">电源<span class="arrow">▲</span></th>
            <th class="sortable" data-key="mem_mb">内存<span class="arrow">▲</span></th>
            <th class="sortable" data-key="disk_gb">磁盘<span class="arrow">▲</span></th>
            <th>Tools</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="vm-body"></tbody>
      </table>
      <div class="no-rows" id="no-rows" hidden>没有匹配的虚拟机</div>
    </div>
  </section>

  <div class="empty" id="empty" hidden>
    <h2>还没有接入任何 ESXi 主机</h2>
    <p>点右上角「设置」填地址和账号，保存时会先验证能不能连上。</p>
    <button class="primary" id="btn-empty-add">添加第一台主机</button>
  </div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <strong>设置</strong>
    <button id="btn-close">关闭</button>
  </div>
  <div class="drawer-body">
    <form id="form-add">
      <div class="form-title" id="form-title">接入一台 ESXi 主机</div>
      <div class="field">
        <label for="f-name">显示名称（可留空，默认用地址）</label>
        <input id="f-name" autocomplete="off" placeholder="比如 ESXi-152">
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-host">主机地址</label>
          <input id="f-host" required autocomplete="off" placeholder="192.168.2.152">
        </div>
        <div class="field">
          <label for="f-port">端口</label>
          <input id="f-port" value="443" inputmode="numeric">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-user">账号</label>
          <input id="f-user" required autocomplete="off" value="root">
        </div>
        <div class="field">
          <label for="f-pass">密码</label>
          <input id="f-pass" type="password" autocomplete="new-password">
        </div>
      </div>
      <div class="form-actions">
        <button class="primary" type="submit" id="btn-save">验证并保存</button>
        <button type="button" id="btn-cancel-edit" hidden>取消编辑</button>
      </div>
      <p class="hint" id="form-hint">密码用 Windows DPAPI 加密后存在本机 data/hosts.json，页面不会回显。</p>
    </form>

    <div>
      <label>已接入的主机</label>
      <div class="host-list" id="host-list"></div>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<div class="modal" id="danger-modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="danger-title">
    <h3 id="danger-title">危险操作</h3>
    <p id="danger-desc"></p>
    <label class="check">
      <input type="checkbox" id="danger-ack">
      <span>我明白这会让客户机立刻中断，未保存的数据会丢失</span>
    </label>
    <label for="danger-input" class="check-label">输入虚拟机名称 <code id="danger-name"></code> 以确认</label>
    <input type="text" id="danger-input" autocomplete="off" spellcheck="false" placeholder="直接复制上面的名称">
    <div class="modal-actions">
      <button type="button" id="danger-cancel">取消</button>
      <button type="button" class="danger" id="danger-go" disabled>执行</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const cardsEl = $("cards"), stamp = $("stamp"), emptyEl = $("empty");
const overlay = $("overlay"), drawer = $("drawer"), toastEl = $("toast");

const POWER_RANK = { poweredOn: 0, suspended: 1, poweredOff: 2, unknown: 3 };
const POWER_TEXT = { poweredOn: "运行中", suspended: "已挂起", poweredOff: "已关机" };
const BUSY_TEXT = { on: "开机中…", shutdown: "关机中…", reboot: "重启中…" };
const TOOLS_TEXT = {
  toolsOk: "已运行", toolsOld: "需升级", toolsNotRunning: "未运行", toolsNotInstalled: "未安装",
};

const state = {
  items: [], vms: [], loading: false,
  q: "", host: "",
  sort: { key: "name", dir: 1 },
  open: new Set(),
  busy: {},
  menu: null,          // 展开危险操作二级菜单的行
  danger: null,        // 正在确认的危险操作 {vm, action}
  editing: null,       // 抽屉里正在编辑的主机 id
  removing: null,      // 抽屉里正在确认移除的主机 id
};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function toast(message, bad = false) {
  toastEl.textContent = message;
  toastEl.classList.toggle("bad", bad);
  toastEl.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

const gb = (n) => (n === null || n === undefined ? "—" : n >= 1024 ? (n / 1024).toFixed(1) + " TB" : n + " GB");
const mem = (n) => (n === null || n === undefined ? "—" : n >= 1024 ? (n / 1024).toFixed(1) + " GB" : n + " MB");

function uptimeText(seconds) {
  if (!seconds) return "—";
  const d = Math.floor(seconds / 86400);
  const h = Math.floor((seconds % 86400) / 3600);
  if (d > 0) return `${d} 天 ${h} 小时`;
  const m = Math.floor((seconds % 3600) / 60);
  return h > 0 ? `${h} 小时 ${m} 分` : `${m} 分`;
}

function meter(label, used, pct) {
  const cls = pct === null ? "" : pct >= 90 ? "crit" : pct >= 70 ? "hot" : "";
  const width = pct === null ? 0 : Math.min(100, Math.max(2, pct));
  return `
    <div class="meter">
      <div class="meter-row"><span>${label}</span>
        <b>${pct === null ? "—" : pct.toFixed(1) + "%"}${used ? " · " + used : ""}</b>
      </div>
      <div class="track"><i class="${cls}" style="width:${width}%"></i></div>
    </div>`;
}

function cardHtml(item) {
  const s = item.stats;
  if (!s || item.error) {
    const err = item.error || { kind: "unknown", message: "没有采集到数据" };
    return `
      <article class="card broken">
        <div class="card-head">
          <span class="dot bad"></span>
          <div>
            <div class="card-title">${esc(item.name)}</div>
            <div class="card-sub">${esc(item.host)}:${esc(item.port)}</div>
          </div>
        </div>
        <div class="error-box"><b>离线</b>（${esc(err.kind)}）<br>${esc(err.message)}</div>
        <div class="card-foot"><span class="card-sub">账号 ${esc(item.user)}</span></div>
      </article>`;
  }

  const dsTotal = s.datastores.reduce((sum, d) => sum + (d.capacity_gb || 0), 0);
  const dsFree = s.datastores.reduce((sum, d) => sum + (d.free_gb || 0), 0);
  const dsPct = dsTotal ? Math.round((dsTotal - dsFree) / dsTotal * 1000) / 10 : null;
  const dotCls = s.connection_state === "connected" ? "ok" : "warn";

  return `
    <article class="card">
      <div class="card-head">
        <span class="dot ${dotCls}"></span>
        <div>
          <div class="card-title">${esc(item.name)}</div>
          <div class="card-sub">${esc(item.host)}:${esc(item.port)} · ${esc(s.hostname || "")}</div>
        </div>
      </div>
      <div class="kv">
        <div><dt>版本</dt><dd>ESXi ${esc(s.version || "—")} build ${esc(s.build || "—")}</dd></div>
        <div><dt>状态</dt><dd>${esc(s.connection_state === "connected" ? "已连接" : s.connection_state || "未知")}</dd></div>
        <div><dt>CPU</dt><dd>${esc(s.cpu_cores)} 核 · ${esc(s.cpu_mhz)} MHz
          <span class="model">${esc(s.cpu_model || "")}</span></dd></div>
        <div><dt>运行时长</dt><dd>${esc(uptimeText(s.uptime_seconds))}</dd></div>
      </div>
      ${meter("CPU 使用率", "", s.cpu_usage_pct)}
      ${meter("内存", `${mem(s.mem_used_mb)} / ${mem(s.mem_total_mb)}`, s.mem_usage_pct)}
      ${meter("数据存储", `${gb(Math.round((dsTotal - dsFree) * 10) / 10)} / ${gb(dsTotal)}`, dsPct)}
      <div class="kv">
        <div><dt>虚拟机</dt><dd>${esc(s.vm_on)} 开机 / ${esc(s.vm_total)} 台</dd></div>
        <div><dt>数据存储</dt><dd>${esc(s.datastores.length)} 个</dd></div>
      </div>
      <div class="card-foot">
        <a href="https://${esc(item.host)}/ui/" target="_blank" rel="noopener">打开 Host Client ↗</a>
        <span class="card-sub" style="margin-left:auto" title="证书 SHA256 指纹：${esc(s.fingerprint || "")}">${esc((s.fingerprint || "").slice(0, 17))}…</span>
      </div>
      ${item.fingerprint_changed ? `
      <div class="warn-box">
        <b>证书换了</b>：现在连到的是 <span class="mono">${esc((item.fingerprint_now || "").slice(0, 17))}…</span>，
        与接入时记录的 <span class="mono">${esc((item.fingerprint || "").slice(0, 17))}…</span> 不一致。
        如果是重装过 ESXi 属正常，否则要当心。
      </div>` : ""}
    </article>`;
}

function visibleVms() {
  const q = state.q.trim().toLowerCase();
  let rows = state.vms;
  if (state.host) rows = rows.filter((v) => v.host_id === state.host);
  if (q) {
    rows = rows.filter((v) =>
      (v.name || "").toLowerCase().includes(q) || (v.ip || "").toLowerCase().includes(q));
  }
  const { key, dir } = state.sort;
  const cmp = (a, b) => {
    let x = a[key], y = b[key];
    if (key === "power") { x = POWER_RANK[a.power] ?? 9; y = POWER_RANK[b.power] ?? 9; }
    if (key === "name") { x = (x || "").toLowerCase(); y = (y || "").toLowerCase(); }
    if (x === y) return (a.name || "").localeCompare(b.name || "");
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return x < y ? -1 : 1;
  };
  return rows.slice().sort((a, b) => cmp(a, b) * dir);
}

function vmKey(vm) { return vm.host_id + "::" + (vm.moref || vm.name); }

function rowHtml(vm) {
  const key = vmKey(vm);
  const open = state.open.has(key);
  const powerCls = vm.power === "poweredOn" ? "on" : vm.power === "suspended" ? "sus" : "off";
  const memCell = vm.mem_mb == null ? "—"
    : `${mem(vm.mem_mb)}${vm.mem_used_mb != null ? ` <span class="muted">(${mem(vm.mem_used_mb)} 实时)</span>` : ""}`;
  const tools = vm.tools ? (TOOLS_TEXT[vm.tools] || vm.tools) : "—";
  const busy = state.busy[key];
  const toolsRunning = vm.tools_running === "guestToolsRunning";
  const canOn = !busy && vm.power !== "poweredOn";
  const canGraceful = !busy && vm.power === "poweredOn" && toolsRunning;
  const guard = vm.power !== "poweredOn"
    ? "虚拟机没有在运行"
    : "客户机 VMware Tools 没在运行，只能用强制断电";
  const menuOpen = state.menu === key;
  const canForce = !busy && vm.power === "poweredOn";
  const acts = busy
    ? `<button class="act" disabled>${esc(BUSY_TEXT[busy] || "处理中…")}</button>`
    : `<button class="act" data-act="on"${canOn ? "" : " disabled"} title="${esc(canOn ? "开机" : "已经是开机状态")}">开机</button>
       <button class="act" data-act="shutdown"${canGraceful ? "" : " disabled"} title="${esc(canGraceful ? "走客户机自身的关机流程" : guard)}">关机</button>
       <button class="act" data-act="reboot"${canGraceful ? "" : " disabled"} title="${esc(canGraceful ? "走客户机自身的重启流程" : guard)}">重启</button>
       <button class="act more" data-more="1" aria-expanded="${menuOpen}" title="强制操作（会丢数据）">⋯</button>
       ${menuOpen ? `<div class="menu">
         <div class="menu-note">强制操作，不动客户机</div>
         <button data-force="poweroff"${canForce ? "" : " disabled"}
           title="${esc(canForce ? "相当于拔电源" : "虚拟机没有在运行")}">强制断电</button>
         <button data-force="reset"${canForce ? "" : " disabled"}
           title="${esc(canForce ? "相当于按复位键" : "虚拟机没有在运行")}">强制重置</button>
       </div>` : ""}`;
  const detail = open ? `
    <tr class="detail"><td colspan="9"><dl class="detail-body">
      <div><dt>CPU</dt><dd>${esc(vm.num_cpu ?? "—")} 核</dd></div>
      <div><dt>内存</dt><dd>${esc(mem(vm.mem_mb))}</dd></div>
      <div><dt>磁盘合计</dt><dd>${esc(gb(vm.disk_gb))}</dd></div>
      <div><dt>Tools</dt><dd>${esc(tools)}${vm.tools_running ? ` · ${esc(vm.tools_running)}` : ""}</dd></div>
      <div><dt>IP</dt><dd class="mono">${esc(vm.ip || "未获取")}</dd></div>
      <div><dt>开机时间</dt><dd>${esc(vm.boot_time || "—")}</dd></div>
      <div><dt>UUID</dt><dd class="mono">${esc(vm.uuid || "—")}</dd></div>
      <div><dt>VMX 路径</dt><dd class="mono">${esc(vm.vmx || "—")}</dd></div>
    </dl></td></tr>` : "";
  return `
    <tr class="row ${open ? "open" : ""}" data-key="${esc(key)}">
      <td class="name"><span class="caret">▶</span>${esc(vm.name)}</td>
      <td class="muted">${esc(vm.host_name)}</td>
      <td class="mono">${esc(vm.ip || "—")}</td>
      <td title="${esc(vm.os_id || "")}">${esc(vm.os || "—")}</td>
      <td><span class="pill ${powerCls}">${esc(POWER_TEXT[vm.power] || vm.power)}</span></td>
      <td class="num">${memCell}</td>
      <td class="num">${esc(gb(vm.disk_gb))}</td>
      <td class="muted">${esc(tools)}</td>
      <td class="acts">${acts}</td>
    </tr>${detail}`;
}

function renderTable() {
  const rows = visibleVms();
  $("vm-body").innerHTML = rows.map(rowHtml).join("");
  $("no-rows").hidden = rows.length > 0;
  $("count").textContent = `${rows.length} / ${state.vms.length} 台`;
  document.querySelectorAll("thead th.sortable").forEach((th) => {
    const active = th.dataset.key === state.sort.key;
    th.classList.toggle("sorted", active);
    th.querySelector(".arrow").textContent = active ? (state.sort.dir > 0 ? "▲" : "▼") : "▲";
  });
}

function renderPanel() {
  const opts = [`<option value="">全部主机</option>`]
    .concat(state.items.map((h) => `<option value="${esc(h.id)}">${esc(h.name)}（${h.stats ? h.stats.vm_total : "?"} 台）</option>`));
  $("host-filter").innerHTML = opts.join("");
  $("host-filter").value = state.host;
  $("host-list").innerHTML = state.items.length === 0
    ? `<div class="host-item mono">还没有接入主机</div>`
    : state.items.map((h) => {
      const removing = state.removing === h.id;
      const editing = state.editing === h.id;
      return `
        <div class="host-item${editing ? " editing" : ""}">
          <div class="host-head">
            <div class="name">${esc(h.name)}${h.fingerprint_changed ? ` <span class="tag bad">证书变了</span>` : ""}</div>
            <div class="host-ops">
              <button type="button" data-edit="${esc(h.id)}">${editing ? "编辑中" : "编辑"}</button>
              <button type="button" class="danger-text" data-remove="${esc(h.id)}">移除</button>
            </div>
          </div>
          <div class="mono">${esc(h.host)}:${esc(h.port)} · ${esc(h.user)}</div>
          ${removing ? `
          <div class="remove-box">
            <div>移除后这台主机上的虚拟机将不再出现在列表里（不会动虚拟机本身）。请输入 <b class="mono">${esc(h.host)}</b> 确认：</div>
            <input type="text" data-confirm="${esc(h.id)}" autocomplete="off" placeholder="${esc(h.host)}">
            <div class="remove-ops">
              <button type="button" data-cancel-remove="1">取消</button>
              <button type="button" class="danger" data-do-remove="${esc(h.id)}">确认移除</button>
            </div>
          </div>` : ""}
        </div>`;
    }).join("");
}

function render() {
  emptyEl.hidden = state.items.length > 0;
  $("vm-section").hidden = state.items.length === 0;
  cardsEl.innerHTML = state.items.map(cardHtml).join("");
  renderPanel();
  renderTable();
}

async function refresh() {
  if (state.loading) return;
  state.loading = true;
  const btn = $("btn-refresh");
  btn.disabled = true;
  stamp.textContent = "正在读取…";
  try {
    const res = await fetch("/api/inventory");
    const data = await res.json();
    if (!data.ok) throw new Error(data.error?.message || "读取失败");
    state.items = data.items || [];
    state.vms = data.vms || [];
    const known = new Set(state.items.map((h) => h.id));
    if (state.host && !known.has(state.host)) state.host = "";
    render();
    stamp.textContent = "最后更新于 " + (data.generated_at || "").replace("T", " ")
      + (data.cached ? "（10 秒内缓存）" : "");
  } catch (err) {
    stamp.textContent = "读取失败";
    toast("读取失败：" + err.message, true);
  } finally {
    state.loading = false;
    btn.disabled = false;
  }
}

function openDrawer(open) {
  drawer.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
  drawer.setAttribute("aria-hidden", open ? "false" : "true");
  if (open) $("f-host").focus();
}

$("btn-refresh").onclick = refresh;
$("btn-settings").onclick = () => openDrawer(true);
$("btn-empty-add").onclick = () => openDrawer(true);
$("btn-close").onclick = () => openDrawer(false);
overlay.onclick = () => openDrawer(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") openDrawer(false); });
$("origin").textContent = location.host;

$("q").oninput = (e) => { state.q = e.target.value; renderTable(); };
$("host-filter").onchange = (e) => { state.host = e.target.value; renderTable(); };

document.querySelectorAll("thead th.sortable").forEach((th) => {
  th.onclick = () => {
    const key = th.dataset.key;
    if (state.sort.key === key) state.sort.dir *= -1;
    else state.sort = { key, dir: 1 };
    renderTable();
  };
});

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function pollTask(id) {
  const deadline = Date.now() + 6 * 60 * 1000;
  while (Date.now() < deadline) {
    await sleep(1500);
    const res = await fetch("/api/tasks/" + encodeURIComponent(id));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error?.message || "任务状态读不到");
    if (data.task.state !== "running") return data.task;
  }
  throw new Error("等太久还没结果，请点刷新确认");
}

async function runPower(vm, action, extra) {
  const key = vmKey(vm);
  if (state.busy[key]) return;
  state.busy[key] = action;
  state.menu = null;
  renderTable();
  try {
    const res = await fetch("/api/vms/power", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign(
        { host_id: vm.host_id, moref: vm.moref, action, name: vm.name },
        extra || {},
      )),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error?.message || "提交失败");
    const task = await pollTask(data.task.id);
    if (task.state === "error") throw new Error(task.error?.message || task.message);
    // 只把这一行会变的字段就地更新，不重新采集三台主机。
    Object.assign(vm, task.vm || {});
    const host = state.items.find((h) => h.id === vm.host_id);
    if (host && host.stats) {
      host.stats.vm_on = state.vms.filter((v) => v.host_id === vm.host_id && v.power === "poweredOn").length;
      cardsEl.innerHTML = state.items.map(cardHtml).join("");
    }
    toast(`${vm.name}：${task.label || "操作"}完成`);
  } catch (err) {
    toast(`${vm.name}：${err.message}`, true);
  } finally {
    delete state.busy[key];
    renderTable();
  }
}

const FORCE_TEXT = { poweroff: "强制断电", reset: "强制重置" };

function openDanger(vm, action) {
  state.danger = { vm, action };
  state.menu = null;          // 收起二级菜单，别和弹窗叠在一起
  renderTable();
  $("danger-title").textContent = FORCE_TEXT[action] || "危险操作";
  $("danger-desc").innerHTML = action === "poweroff"
    ? `相当于直接拔掉 <b>${esc(vm.name)}</b> 的电源，客户机里的未保存数据会丢。`
    : `相当于按 <b>${esc(vm.name)}</b> 的复位键，客户机不会走关机流程，未保存数据会丢。`;
  $("danger-name").textContent = vm.name;
  $("danger-ack").checked = false;
  $("danger-input").value = "";
  $("danger-go").disabled = true;
  $("danger-modal").classList.add("open");
  $("danger-modal").setAttribute("aria-hidden", "false");
  $("danger-input").focus();
}

function closeDanger() {
  state.danger = null;
  $("danger-modal").classList.remove("open");
  $("danger-modal").setAttribute("aria-hidden", "true");
}

function dangerReady() {
  const d = state.danger;
  if (!d) return false;
  return $("danger-ack").checked && $("danger-input").value.trim() === d.vm.name;
}

$("danger-ack").onchange = () => { $("danger-go").disabled = !dangerReady(); };
$("danger-input").oninput = () => { $("danger-go").disabled = !dangerReady(); };
$("danger-cancel").onclick = closeDanger;
$("danger-modal").onclick = (e) => { if (e.target === $("danger-modal")) closeDanger(); };
$("danger-go").onclick = () => {
  const d = state.danger;
  if (!d || !dangerReady()) return;
  closeDanger();
  runPower(d.vm, d.action, { confirm_name: d.vm.name });
};

$("vm-body").onclick = (e) => {
  const moreBtn = e.target.closest("button[data-more]");
  if (moreBtn) {
    const key = moreBtn.closest("tr.row").dataset.key;
    state.menu = state.menu === key ? null : key;
    renderTable();
    return;
  }
  const forceBtn = e.target.closest("button[data-force]");
  if (forceBtn && !forceBtn.disabled) {
    const key = forceBtn.closest("tr.row").dataset.key;
    const vm = state.vms.find((v) => vmKey(v) === key);
    if (vm) openDanger(vm, forceBtn.dataset.force);
    return;
  }
  const actBtn = e.target.closest("button.act");
  if (actBtn) {
    const row = actBtn.closest("tr.row");
    const key = row && row.dataset.key;
    const vm = key && state.vms.find((v) => vmKey(v) === key);
    if (vm && actBtn.dataset.act) runPower(vm, actBtn.dataset.act);
    return;
  }
  if (state.menu) { state.menu = null; renderTable(); }
  const tr = e.target.closest("tr.row");
  if (!tr) return;
  const key = tr.dataset.key;
  if (state.open.has(key)) state.open.delete(key); else state.open.add(key);
  renderTable();
};

function startEdit(id) {
  const h = state.items.find((x) => x.id === id);
  if (!h) return;
  state.editing = id;
  state.removing = null;
  $("form-title").textContent = `编辑「${h.name}」`;
  $("f-name").value = h.name;
  $("f-host").value = h.host;
  $("f-port").value = h.port;
  $("f-user").value = h.user;
  $("f-pass").value = "";
  $("f-pass").placeholder = "留空不改密码";
  $("btn-cancel-edit").hidden = false;
  $("btn-save").textContent = "验证并保存";
  $("form-hint").textContent = "密码留空即沿用原密码；改了地址或账号会先真连一次，连不上就不保存。";
  renderPanel();
  $("f-name").focus();
}

function stopEdit() {
  state.editing = null;
  $("form-add").reset();
  $("f-port").value = "443";
  $("f-user").value = "root";
  $("f-pass").placeholder = "";
  $("form-title").textContent = "接入一台 ESXi 主机";
  $("btn-cancel-edit").hidden = true;
  $("btn-save").textContent = "验证并保存";
  $("form-hint").textContent = "密码用 Windows DPAPI 加密后存在本机 data/hosts.json，页面不会回显。";
  renderPanel();
}

async function confirmRemove(id) {
  const h = state.items.find((x) => x.id === id);
  if (!h) return;
  const input = document.querySelector(`[data-confirm="${CSS.escape(id)}"]`);
  const typed = (input ? input.value : "").trim();
  if (typed !== h.host) {
    toast(`请原样输入 ${h.host} 以确认`, true);
    if (input) input.focus();
    return;
  }
  try {
    const res = await fetch(`/api/hosts/${encodeURIComponent(id)}/delete`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ confirm: typed }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error?.message || "移除失败");
    state.removing = null;
    if (state.host === id) state.host = "";
    if (state.editing === id) stopEdit();
    toast(`已移除 ${h.name}`);
    await refresh();
  } catch (err) {
    toast(err.message, true);
  }
}

$("btn-cancel-edit").onclick = stopEdit;

$("host-list").onclick = (e) => {
  const editBtn = e.target.closest("[data-edit]");
  if (editBtn) { startEdit(editBtn.dataset.edit); return; }
  const removeBtn = e.target.closest("[data-remove]");
  if (removeBtn) {
    state.removing = state.removing === removeBtn.dataset.remove ? null : removeBtn.dataset.remove;
    renderPanel();
    return;
  }
  if (e.target.closest("[data-cancel-remove]")) {
    state.removing = null;
    renderPanel();
    return;
  }
  const doRemove = e.target.closest("[data-do-remove]");
  if (doRemove) confirmRemove(doRemove.dataset.doRemove);
};

$("form-add").onsubmit = async (e) => {
  e.preventDefault();
  const save = $("btn-save");
  const editing = state.editing;
  const body = {
    name: $("f-name").value.trim(),
    host: $("f-host").value.trim(),
    port: Number($("f-port").value) || 443,
    user: $("f-user").value.trim(),
    password: $("f-pass").value,
  };
  if (!editing && !body.password) {
    toast("请填写登录密码", true);
    return;
  }
  save.disabled = true;
  save.textContent = "验证中…";
  try {
    const url = editing ? `/api/hosts/${encodeURIComponent(editing)}` : "/api/hosts";
    const res = await fetch(url, {
      method: editing ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error?.message || "保存失败");
    const label = editing ? `已更新 ${data.host.name}` : `已接入 ${data.host.name}（${data.info?.product || "ESXi"} ${data.info?.version || ""}）`;
    stopEdit();
    openDrawer(false);
    toast(data.fingerprint_changed
      ? `${label}；注意：证书指纹变了，卡片上会提示`
      : label);
    await refresh();
  } catch (err) {
    toast(err.message, true);
  } finally {
    save.disabled = false;
    save.textContent = "验证并保存";
